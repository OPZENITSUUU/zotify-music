name: TV

permissions:
  contents: read

# The Android TV app builds from the phone app's sources (see tv/README.md), so
# a change under app/, shared/, sharedUi/ or native/ can break it as easily as
# one under tv/.
on:
  push:
    branches: [main]
    paths:
      - 'tv/**'
      - 'app/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/tv.yml'
  pull_request:
    paths:
      - 'tv/**'
      - 'app/**'
      - 'shared/**'
      - 'sharedUi/**'
      - 'native/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - '.github/workflows/tv.yml'

concurrency:
  group: tv-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tv:
    name: Android TV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Verify existing production signing identity without exposing secrets
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Actions signing secret is missing or empty: $name"
              exit 1
            fi
          done
          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$temp_dir/release.jks"; then
            echo "::error::Configured release keystore is not valid base64"
            exit 1
          fi
          if [[ ! -s "$temp_dir/release.jks" ]] || ! keytool -list \
            -keystore "$temp_dir/release.jks" -storepass "$KEYSTORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Configured keystore, password, or signing alias is invalid"
            exit 1
          fi
          printf 'signing validation\n' > "$temp_dir/payload.txt"
          jar cf "$temp_dir/unsigned.jar" -C "$temp_dir" payload.txt >/dev/null
          if ! jarsigner -keystore "$temp_dir/release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            -signedjar "$temp_dir/signed.jar" "$temp_dir/unsigned.jar" "$KEY_ALIAS" \
            >/dev/null 2>&1; then
            echo "::error::Configured signing key password cannot unlock the existing production alias"
            exit 1
          fi
          keytool -exportcert -alias "$KEY_ALIAS" -keystore "$temp_dir/release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -file "$temp_dir/certificate.der" >/dev/null 2>&1
          certificate_sha256="$(sha256sum "$temp_dir/certificate.der" | awk '{print toupper($1)}')"
          expected_sha256="EAD01DEB09889B57D7C9E16E52811CE02E85754BD6C19A483AAF772A59C7EE30"
          if [[ "$certificate_sha256" != "$expected_sha256" ]]; then
            echo "::error::Production signing certificate fingerprint mismatch"
            exit 1
          fi
          echo "Existing production signing certificate verified."

      - name: Write local.properties
        shell: bash
        env:
          LASTFM_API_KEY: ${{ secrets.LASTFM_API_KEY }}
          LASTFM_SECRET: ${{ secrets.LASTFM_SECRET }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s\n' "LASTFM_API_KEY=$LASTFM_API_KEY" "LASTFM_SECRET=$LASTFM_SECRET" > local.properties

      - run: chmod +x gradlew

      - name: Build the TV dev APK
        run: ./gradlew :tv:assembleDevDebug

      - name: Upload the TV dev APK
        uses: actions/upload-artifact@v4
        with:
          name: zotify-music-tv-dev-debug
          path: tv/build/outputs/apk/dev/debug/*universal*.apk

      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: tv-build-reports
          path: tv/build/reports/
