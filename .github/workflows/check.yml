name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop-linux:
    name: Desktop · Linux
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopUi:jvmTest :desktopApp:test

      - name: Build the distributable
        run: ./gradlew :desktopApp:createDistributable

      - name: The analyser is in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord/lib/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/libbitchord_analysis.so'
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-linux-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/

  desktop-windows:
    name: Desktop · Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        shell: bash
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - name: CMake version
        run: cmake --version

      - name: Tests
        run: .\gradlew.bat :shared:jvmTest :desktopUi:jvmTest :desktopApp:test

      - name: Build the distributable
        run: .\gradlew.bat :desktopApp:createDistributable

      - name: The analyser is in the jar
        shell: bash
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'native/bitchord_analysis.dll'
          jar tf "$jar" | grep -q 'models/.*\.onnx'
          # WinRT, so only MSVC can build it and only this job ever does.
          jar tf "$jar" | grep -q 'native/bitchord_smtc.dll'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/

  desktop-macos:
    name: Desktop · macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew :shared:jvmTest :desktopUi:jvmTest :desktopApp:test

      - name: Build the distributable
        run: ./gradlew :desktopApp:createDistributable

      - name: The analyser and models are in the jar
        run: |
          jar=$(ls desktopApp/build/compose/binaries/main/app/BitChord.app/Contents/app/desktopApp*.jar)
          jar tf "$jar" | grep -q 'models/.*\.onnx'

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-test-reports
          path: |
            desktopApp/build/reports/tests/
            shared/build/reports/tests/

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write local.properties
        run: |
          echo "LASTFM_API_KEY=${{ secrets.LASTFM_API_KEY }}" > local.properties
          echo "LASTFM_SECRET=${{ secrets.LASTFM_SECRET }}" >> local.properties

      - run: chmod +x gradlew

      - name: Tests
        run: ./gradlew testDevDebugUnitTest testProdDebugUnitTest

      - name: Build the dev APK
        run: ./gradlew assembleDevDebug

      - name: Upload the dev APK
        uses: actions/upload-artifact@v4
        with:
          name: zotify-dev-debug
          path: app/build/outputs/apk/dev/debug/*.apk

      # Build a real update for the installed production app on main pushes.
      # This is an Actions artifact only; it does not create or publish a GitHub Release.
      - name: Configure production signing
        if: github.event_name == 'push'
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Actions secret is missing or empty: $name"
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > zotify-release.jks
          keytool -list -keystore zotify-release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null
          keytool -exportcert -alias "$KEY_ALIAS" -keystore zotify-release.jks \
            -storepass "$KEYSTORE_PASSWORD" -file "$RUNNER_TEMP/zotify-release.der" >/dev/null
          certificate_sha256="$(sha256sum "$RUNNER_TEMP/zotify-release.der" | awk '{print toupper($1)}')"
          expected_sha256="EAD01DEB09889B57D7C9E16E52811CE02E85754BD6C19A483AAF772A59C7EE30"
          if [[ "$certificate_sha256" != "$expected_sha256" ]]; then
            echo "::error::Production signing certificate fingerprint mismatch"
            exit 1
          fi
          {
            printf 'storeFile=zotify-release.jks\\n'
            printf 'storePassword=%s\\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 zotify-release.jks keystore.properties

      - name: Build signed production APKs
        if: github.event_name == 'push'
        run: ./gradlew assembleProdRelease

      - name: Verify production APK identity and signature
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK path is unavailable}}"
          build_tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/prod/release/*.apk; do
            test -s "$apk"
            "$build_tools/aapt" dump badging "$apk" | grep -F "package: name='com.zotifymusic.player'"
            "$build_tools/zipalign" -c 4 "$apk"
            "$build_tools/apksigner" verify --verbose --print-certs "$apk" | grep -F "EAD01DEB09889B57D7C9E16E52811CE02E85754BD6C19A483AAF772A59C7EE30"
          done

      - name: Upload signed production update APKs
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: zotify-production-update-signed
          path: app/build/outputs/apk/prod/release/*.apk
          if-no-files-found: error

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-test-reports
          path: app/build/reports/tests/

  backend:
    name: Backend · Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...
