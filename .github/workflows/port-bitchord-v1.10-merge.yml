name: One-time BitChord v1.10 three-way source merge

on:
  push:
    branches:
      - integration/bitchord-v1.10

permissions:
  contents: write

concurrency:
  group: zotify-bitchord-v1.10-three-way
  cancel-in-progress: false

jobs:
  merge-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 90
    steps:
      - name: Check out Zotify integration branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin

      - name: Configure Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Merge BitChord v1.10 using the real common ancestor
        shell: bash
        env:
          OLD_BASE: edc1e6f36febf71a118e649411d2fc21b70ead45
          UPSTREAM_MERGE: 21356206de5594ca0bdaf4680ca2db68a2287729
          ZOTIFY_BASE: 5f7031f006265aa7be2a49ea78585435d5f21e36
        run: |
          set -euo pipefail
          git remote add bitchord https://github.com/kushagrasinghx/BitChord.git
          git fetch --no-tags bitchord main
          git cat-file -e "${OLD_BASE}^{commit}"
          git cat-file -e "${UPSTREAM_MERGE}^{commit}"
          git merge-base --is-ancestor "$OLD_BASE" "$UPSTREAM_MERGE"

          target_head="$(git rev-parse HEAD)"

          # Restore project-owned files from the untouched Zotify main snapshot.
          # The previous patch experiment is not allowed to replace these.
          git checkout "$ZOTIFY_BASE" -- .github README.md Banner.png MAINTAINERS.md .gitignore build.gradle.kts tv/build.gradle.kts
          git add -A

          # Bridge the independent Zotify history to its actual BitChord ancestor
          # without rewriting or force-pushing any existing branch history.
          target_tree="$(git write-tree)"
          bridge="$(printf '%s\n' 'Synthetic merge-base bridge for Zotify upstream integration' | git commit-tree "$target_tree" -p "$target_head" -p "$OLD_BASE")"
          git reset --hard "$bridge"

          set +e
          git merge --no-commit --no-ff --no-edit "$UPSTREAM_MERGE"
          merge_status=$?
          set -e

          mapfile -d '' -t conflicts < <(git diff --name-only --diff-filter=U -z)
          union_count=0
          preserve_count=0

          for path in "${conflicts[@]}"; do
            case "$path" in
              build.gradle.kts|app/build.gradle.kts|tv/build.gradle.kts|settings.gradle.kts|.gitignore|MAINTAINERS.md|README.md|Banner.png|Logo.png|.github/*)
                git checkout --ours -- "$path" 2>/dev/null || true
                git add -A -- "$path"
                preserve_count=$((preserve_count + 1))
                ;;
              *.kt|*.java|*.xml|*.kts)
                if git show ":1:$path" > "$RUNNER_TEMP/base" 2>/dev/null &&
                   git show ":2:$path" > "$RUNNER_TEMP/ours" 2>/dev/null &&
                   git show ":3:$path" > "$RUNNER_TEMP/theirs" 2>/dev/null; then
                  if git merge-file --union --stdout "$RUNNER_TEMP/ours" "$RUNNER_TEMP/base" "$RUNNER_TEMP/theirs" > "$path"; then
                    git add -- "$path"
                    union_count=$((union_count + 1))
                  else
                    git checkout --ours -- "$path"
                    git add -- "$path"
                    preserve_count=$((preserve_count + 1))
                  fi
                else
                  if git ls-tree -e "$target_head" -- "$path" | grep -q .; then
                    git checkout --ours -- "$path"
                    git add -- "$path"
                  else
                    git rm -f --ignore-unmatch -- "$path" >/dev/null || true
                    rm -f -- "$path"
                  fi
                  preserve_count=$((preserve_count + 1))
                fi
                ;;
              *)
                if git ls-tree -e "$target_head" -- "$path" | grep -q .; then
                  git checkout --ours -- "$path"
                  git add -- "$path"
                else
                  git rm -f --ignore-unmatch -- "$path" >/dev/null || true
                  rm -f -- "$path"
                fi
                preserve_count=$((preserve_count + 1))
                ;;
            esac
          done

          # Preserve Zotify app identity and settings plugin pins even when those
          # Gradle files happened to auto-merge without a conflict.
          git checkout "$ZOTIFY_BASE" -- build.gradle.kts tv/build.gradle.kts .github README.md Banner.png MAINTAINERS.md .gitignore
          # Restore settings with the explicit plugin-version resolution fix
          # already committed on this integration branch.
          git checkout "$target_head" -- settings.gradle.kts

          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path("app/build.gradle.kts")
          tv = Path("tv/build.gradle.kts")
          aar = Path("app/libs/onnxruntime-android-1.28.0-automix.aar")

          additions = [
              '    implementation("androidx.media3:media3-transformer:1.11.0")',
              '    implementation("androidx.media3:media3-effect:1.11.0")',
              '    implementation("com.google.android.gms:play-services-auth:21.3.0")',
          ]

          def update_gradle(path: Path, is_tv: bool) -> None:
              text = path.read_text()
              anchor = 'implementation("androidx.media3:media3-datasource-okhttp:1.11.0")'
              if anchor not in text:
                  raise SystemExit(f"Could not find dependency anchor in {path}")
              missing = [line for line in additions if line.strip() not in text]
              if missing:
                  index = text.index(anchor) + len(anchor)
                  text = text[:index] + "\n" + "\n".join(missing) + text[index:]

              if aar.is_file():
                  old = 'implementation("com.microsoft.onnxruntime:onnxruntime-android:1.28.0")'
                  replacement = (
                      'implementation(files("../app/libs/onnxruntime-android-1.28.0-automix.aar"))'
                      if is_tv else
                      'implementation(files("libs/onnxruntime-android-1.28.0-automix.aar"))'
                  )
                  text = text.replace(old, replacement)

              if "ignoreAssetsPattern" not in text:
                  block = (
                      '    androidResources {\n'
                      '        ignoreAssetsPattern = "!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~:!*.onnx"\n'
                      '    }\n\n'
                  )
                  match = re.search(r'(?m)^\s*compileSdk\s*=\s*37\s*$', text)
                  if not match:
                      raise SystemExit(f"Could not find compileSdk anchor in {path}")
                  text = text[:match.end()] + "\n\n" + block + text[match.end():]
              path.write_text(text)

          update_gradle(app, False)
          update_gradle(tv, True)

          manifest = Path("app/src/main/AndroidManifest.xml")
          text = manifest.read_text()
          if 'android:name=".widget.PlaybackTile"' not in text:
              block = '''
                  <!-- Quick Settings tile: play or pause the last queue. -->
                  <service
                      android:name=".widget.PlaybackTile"
                      android:exported="true"
                      android:icon="@drawable/ic_notification_logo"
                      android:label="@string/app_name"
                      android:permission="android.permission.BIND_QUICK_SETTINGS_TILE">
                      <intent-filter>
                          <action android:name="android.service.quicksettings.action.QS_TILE" />
                      </intent-filter>
                  </service>
              '''
              text = text.replace("</application>", block + "\n    </application>")
              manifest.write_text(text)
          PY

          # App code packages remain com.music.bitchord; generated Android
          # resources belong to Zotify's namespace.
          while IFS= read -r -d '' file; do
            sed -i 's/com\.music\.bitchord\.R/com.music.zotifymusic.R/g' "$file"
          done < <(git grep -Ilz 'com.music.bitchord.R' -- app tv wearos 2>/dev/null || true)

          git add -A
          if git diff --name-only --diff-filter=U | grep -q .; then
            echo "::error::Unresolved merge entries remain."
            git diff --name-only --diff-filter=U
            exit 1
          fi
          if git diff --cached --quiet; then
            git add -A
          fi

          report="BITCHORD_V1_10_PORT_REPORT.md"
          cat > "$report" <<EOF
          # BitChord v1.10 source integration

          - Upstream release: https://github.com/kushagrasinghx/BitChord/releases/tag/v1.10
          - Actual three-way base: $OLD_BASE
          - Upstream v1.10 merge commit: $UPSTREAM_MERGE
          - Git merge exit code: $merge_status
          - Conflicts union-merged: $union_count
          - Conflicts retained from Zotify: $preserve_count

          Zotify package/application ID, resource namespace, branding, signing configuration, updater prefix, app version numbering, and release pipeline are preserved. The merge uses the original shared BitChord ancestor, not a patch-only approximation. Phone/TV build dependencies for Drive backup and video-based lyrics sharing are included.
          EOF
          git add "$report"

          rm -f .github/workflows/port-bitchord-v1.10-merge.yml
          git add -A

          git diff --cached --check || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: merge BitChord v1.10 features into Zotify"
          git push origin "HEAD:${GITHUB_REF_NAME}"

          {
            echo "## Merge resolution summary"
            echo "- Git merge exit code: $merge_status"
            echo "- Kotlin/XML/Gradle conflicts union-merged: $union_count"
            echo "- Project-specific conflicts kept from Zotify: $preserve_count"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run JVM and Android unit tests
        run: ./gradlew --no-daemon --stacktrace --console=plain :shared:jvmTest :sharedUi:jvmTest :app:testProdDebugUnitTest

      - name: Build Zotify phone and Android TV variants
        run: ./gradlew --no-daemon --stacktrace --console=plain :app:assembleProdDebug :tv:assembleProdDebug
