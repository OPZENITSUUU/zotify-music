name: Zotify Music Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Git tag to validate, build, and publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: voidmusic-release-${{ inputs.release_tag || github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish signed Android APK
    runs-on: ubuntu-22.04
    steps:
      - name: Check out release source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0

      - name: Validate tag, versionCode, latest release, and duplicate status
        id: release_validation
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_PUSHED_TAG: ${{ github.event.forced }}
        run: |
          set -euo pipefail
          if [[ "$FORCE_PUSHED_TAG" == "true" ]]; then
            echo "::error::A force-updated release tag cannot be published."
            exit 1
          fi

          python3 .github/scripts/validate_release.py \
            --tag "$RELEASE_TAG" \
            --gradle-file build.gradle.kts \
            --repository .

          api="$GITHUB_API_URL/repos/$GITHUB_REPOSITORY"
          headers=(-H "Accept: application/vnd.github+json" \
                   -H "Authorization: Bearer $GITHUB_TOKEN" \
                   -H "X-GitHub-Api-Version: 2022-11-28")
          release_status="$(curl -sS -o "$RUNNER_TEMP/existing-release.json" \
            -w '%{http_code}' "${headers[@]}" "$api/releases/tags/$RELEASE_TAG")"
          case "$release_status" in
            200)
              echo "::error::A GitHub Release already exists for $RELEASE_TAG; refusing to overwrite it."
              exit 1
              ;;
            404) ;;
            *)
              echo "::error::Could not confirm release uniqueness (GitHub API HTTP $release_status)."
              exit 1
              ;;
          esac

          latest_status="$(curl -sS -o "$RUNNER_TEMP/latest-release.json" \
            -w '%{http_code}' "${headers[@]}" "$api/releases/latest")"
          case "$latest_status" in
            200)
              latest_tag="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8")).get("tag_name", ""))' "$RUNNER_TEMP/latest-release.json")"
              if [[ -z "$latest_tag" ]]; then
                echo "::error::GitHub returned a latest release without a tag."
                exit 1
              fi
              ;;
            404) latest_tag="" ;;
            *)
              echo "::error::Could not confirm latest release ordering (GitHub API HTTP $latest_status)."
              exit 1
              ;;
          esac

          version_code="$(python3 .github/scripts/validate_release.py \
            --tag "$RELEASE_TAG" \
            --gradle-file build.gradle.kts \
            --repository . \
            --latest-release-tag "$latest_tag" \
            --print-version-code)"
          echo "version_code=$version_code" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Discord bot JavaScript
        run: node --check discord-bot/index.js

      - name: Run Android unit tests
        run: ./gradlew :app:testProdDebugUnitTest

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Required Actions secret is missing or empty: $name"
              exit 1
            fi
            echo "Required Actions secret is present: $name"
          done

          if ! printf '%s' "$KEYSTORE_BASE64" | base64 --decode > voidmusic-release.jks; then
            echo "::error::KEYSTORE_BASE64 is not valid base64"
            exit 1
          fi
          if [[ ! -s voidmusic-release.jks ]] || ! keytool -list -keystore voidmusic-release.jks \
            -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Decoded keystore, KEYSTORE_PASSWORD, or KEY_ALIAS is invalid"
            exit 1
          fi

          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          printf 'signing validation\n' > "$temp_dir/payload.txt"
          jar cf "$temp_dir/unsigned.jar" -C "$temp_dir" payload.txt >/dev/null
          if ! jarsigner -keystore voidmusic-release.jks -storepass "$KEYSTORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" -signedjar "$temp_dir/signed.jar" \
            "$temp_dir/unsigned.jar" "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::KEY_PASSWORD does not unlock the configured signing alias"
            exit 1
          fi
          jarsigner -verify "$temp_dir/signed.jar" >/dev/null

          keytool -exportcert -alias "$KEY_ALIAS" -keystore voidmusic-release.jks \
            -storepass "$KEYSTORE_PASSWORD" -file "$temp_dir/certificate.der" >/dev/null 2>&1
          certificate_sha256="$(sha256sum "$temp_dir/certificate.der" | awk '{print toupper($1)}')"
          expected_sha256="EAD01DEB09889B57D7C9E16E52811CE02E85754BD6C19A483AAF772A59C7EE30"
          if [[ "$certificate_sha256" != "$expected_sha256" ]]; then
            echo "::error::Signing certificate fingerprint mismatch"
            exit 1
          fi
          echo "Configured Zotify signing certificate verified."

          {
            printf 'storeFile=voidmusic-release.jks\n'
            printf 'storePassword=%s\n' "$KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$KEY_ALIAS"
            printf 'keyPassword=%s\n' "$KEY_PASSWORD"
          } > keystore.properties
          chmod 600 voidmusic-release.jks keystore.properties

      - name: Build signed production APK
        run: ./gradlew :app:assembleProdRelease

      - name: Build signed Android TV production APK
        run: ./gradlew :tv:assembleProdRelease

      - name: Verify package, version, alignment, and signature
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
          EXPECTED_VERSION_CODE: ${{ steps.release_validation.outputs.version_code }}
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:?Android SDK path is unavailable}}"
          build_tools="$(find "$sdk/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          expected_version="${RELEASE_TAG#v}"
          mkdir -p dist
          declare -A outputs=(
            [app-prod-universal-release.apk]=Zotify.Music.apk
            [app-prod-arm64-v8a-release.apk]=Zotify.Music_arm64-v8a.apk
            [app-prod-armeabi-v7a-release.apk]=Zotify.Music_armeabi-v7a.apk
            [app-prod-x86_64-release.apk]=Zotify.Music_x86_64.apk
          )
          for filename in "${!outputs[@]}"; do
            apk="app/build/outputs/apk/prod/release/$filename"
            test -s "$apk"
            badging="$($build_tools/aapt dump badging "$apk")"
            grep -F "package: name='com.zotifymusic.player'" <<< "$badging"
            grep -F "versionName='$expected_version'" <<< "$badging"
            grep -F "versionCode='$EXPECTED_VERSION_CODE'" <<< "$badging"
            "$build_tools/zipalign" -c -v 4 "$apk"
            "$build_tools/apksigner" verify --verbose --print-certs "$apk"
            cp "$apk" "dist/${outputs[$filename]}"
          done

          declare -A tv_outputs=(
            [tv-prod-universal-release.apk]=ZotifyMusicTV.apk
            [tv-prod-arm64-v8a-release.apk]=ZotifyMusicTV_arm64-v8a.apk
            [tv-prod-armeabi-v7a-release.apk]=ZotifyMusicTV_armeabi-v7a.apk
            [tv-prod-x86_64-release.apk]=ZotifyMusicTV_x86_64.apk
          )
          for filename in "${!tv_outputs[@]}"; do
            apk="tv/build/outputs/apk/prod/release/$filename"
            test -s "$apk"
            badging="$($build_tools/aapt dump badging "$apk")"
            grep -F "package: name='com.zotifymusic.player.tv'" <<< "$badging"
            grep -F "versionName='$expected_version'" <<< "$badging"
            grep -F "versionCode='$EXPECTED_VERSION_CODE'" <<< "$badging"
            "$build_tools/zipalign" -c -v 4 "$apk"
            "$build_tools/apksigner" verify --verbose --print-certs "$apk"
            cp "$apk" "dist/${tv_outputs[$filename]}"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          name: Zotify Music ${{ inputs.release_tag || github.ref_name }}
          draft: false
          make_latest: true
          fail_on_unmatched_files: true
          files: |
            dist/Zotify.Music.apk
            dist/Zotify.Music_arm64-v8a.apk
            dist/Zotify.Music_armeabi-v7a.apk
            dist/Zotify.Music_x86_64.apk
            dist/ZotifyMusicTV.apk
            dist/ZotifyMusicTV_arm64-v8a.apk
            dist/ZotifyMusicTV_armeabi-v7a.apk
            dist/ZotifyMusicTV_x86_64.apk
          body: |
            ## Zotify Music ${{ inputs.release_tag || github.ref_name }}

            Android version code: ${{ steps.release_validation.outputs.version_code }}

            APK assets: phone and Android TV universal, ARM64, ARMv7 (32-bit), and x86_64 builds.

            Android 8.0 / API 26+ can install `Zotify.Music.apk` over v1.11.16 when it is signed with the same release key. Use the ABI-specific APKs for smaller downloads.

            Android TV / Google TV / Fire TV 8.0 / API 26+ can use `ZotifyMusicTV.apk` or the matching ABI-specific build. ARMv7 suits most older TVs and streaming sticks; ARM64 is for newer boxes such as Shield and Chromecast with Google TV.

            Wear OS 3+ ships inside the phone APK. After installing or updating the phone app, open **Settings > Zotify Music for Wear OS** to install or update the watch app.

            GitHub provides **Source code (zip)** and **Source code (tar.gz)** links automatically for this release.

            ### New in this release
            - **Settings → More → What’s new:** read the complete v1.11.18 feature and compatibility highlights as a scrollable bullet list inside the app.
            - **Library visibility:** hide albums or manage artists without deleting songs, downloads, playlists, or metadata, then restore them anytime.
            - **Custom playlist covers:** choose an image with Android Photo Picker, preview and save it, or remove it to restore the default artwork.
            - **Android TV updater:** universal and ABI-specific TV APKs are now correctly recognized by the in-app updater.
            - **Mochy-compatible Appearance Skin Manager:** import Look skins from ZIP/JSON files, HTTPS links, and public GitHub repositories or releases.
            - **Review before installing:** inspect skin metadata and supported/unsupported settings before applying a pack.
            - **Native appearance controls:** customise accent colour, pure-black mode, and artwork corner radius.
            - **Skin management:** keep one skin active, disable or remove it to restore the previous appearance, and retain the selection across app restarts.
            - **Localised interface:** skin manager labels and messages use the app's translated Android resources.
            - **Addon defaults cleaned up:** unavailable bundled NullBeat and Nebula entries are retired from defaults. Existing user-created addon entries are preserved; Rukia and LastWave remain in the default set.
            - **Lyrics:** smoother karaoke sweep across pause/resume, aligned RTL translations, fixed Chinese translation, timed YouTube Music lyrics, synced-lyrics preference, and local MP3 lyrics.
            - **Playback and queue:** ordered playlist/album playback, AC-4 through FFmpeg, spatial loudness limiting, swipe/undo/multi-select queue actions, and cleaner queue history.
            - **Replay and backup:** remote-speaker listening counts, stable Top Albums, animated shareable Replay Year stories, and Google Drive backup/restore/auto-sync across devices.
            - **Player and discovery:** Radio, Best Part, Premium Opus, liked-song offline downloads, animated lyrics sharing, AutoMix artwork transitions, song credits, sleep fade-out, improved matching, and library-aware search.
            - **Navigation and artwork:** active-tab scroll-to-top, high-resolution covers, local artwork preservation, tablet video full-screen fixes, and smaller first-use AutoMix downloads.

            ### Compatibility and security
            - Zotify applies only appearance settings its own UI supports. Imported scripts, custom player layouts, fonts, pages, and GPU shaders are not executed or loaded.
            - Remote skin imports require HTTPS. ZIP packages are checked for unsafe paths and size limits.
            - Core playback, queue controls, crossfade, Automix (Beta), synced lyrics, audio diagnostics, and the verified in-app updater remain part of Zotify Music.

            ### App and update details
            - Application ID: `com.zotifymusic.player`.
            - The signed APK is verified for package identity, version, ZIP alignment, and signing certificate before publication.
            - The in-app updater checks the GitHub release asset SHA-256 digest before installation. Android still requires user approval for app installation.

            **Package identity:** Zotify Music uses `com.zotifymusic.player`, separate from the previous `com.voidmusic.player` package. Android installs it as a separate app and does not migrate the old app's private data. Keep the previous app installed until you have moved anything you need. Future Zotify updates can be installed in place, subject to Android approval.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
